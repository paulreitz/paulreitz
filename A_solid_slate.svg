<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paul Reitz">
  <defs>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #2c5282; }
      @media (prefers-color-scheme: dark) { .name { fill: #7ea6d8; } }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #57606a; }
      @media (prefers-color-scheme: dark) { .tagline { fill: #9198a1; } }
    </style>
  </defs>
  <text x="600" y="140" text-anchor="middle" class="name" font-size="72">Paul Reitz</text>
  <line x1="440" y1="174" x2="760" y2="174" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <text x="600" y="220" text-anchor="middle" class="tagline" font-size="23" letter-spacing="0.2">15 years across games, streaming, enterprise, and open source.</text>
